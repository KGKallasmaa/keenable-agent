<!doctype html>
<html lang="en"{% if printing %} data-theme="light"{% endif %}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}Search Audit{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23111827'/%3E%3Ccircle cx='14' cy='14' r='6.5' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Cpath d='M19 19l6.5 6.5' stroke='%2322c55e' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/report.css">
<script>
function favFallback(img) { var s = document.createElement("span"); s.className = "mono-badge"; s.setAttribute("aria-hidden", "true"); s.textContent = img.dataset.mono; img.replaceWith(s); }
</script>
</head>
<body{% if printing %} class="printdoc"{% endif %}>
{% if is_fixture %}<div class="banner">Illustrative fixture: seeded synthetic data, not real results.</div>{% endif %}
{% if not printing %}
<header class="top">
  <a class="mark" href="/"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#111827"/><circle cx="14" cy="14" r="6.5" fill="none" stroke="#fff" stroke-width="3"/><path d="M19 19l6.5 6.5" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round"/></svg>Search Audit</a>
  <nav aria-label="Main"><a href="/"{% if nav == "home" %} aria-current="page"{% endif %}>Reports</a><a href="/methodology"{% if nav == "methodology" %} aria-current="page"{% endif %}>Methodology</a></nav>
</header>
{% endif %}
<main id="main">
{% block main %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
