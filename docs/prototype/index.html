<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Search Audit — prototype</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #fafaf8; --panel: #ffffff; --ink: #111827; --ink-2: #374151; --muted: #6b7280; --line: #e5e7eb; --line-2: #d1d5db; --soft: #f3f4f6;
    --exa: #c2410c; --parallel: #475569; --keen: #2563eb; --select: #dc2626; --routed: #7c3aed;
    --ok: #15803d; --part: #b45309; --fail: #111827;
    --best-bg: #dcfce7; --best-fg: #166534; --worst-bg: #f3f4f6; --worst-fg: #6b7280;
    --serif: "Source Serif 4", Georgia, serif; --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --r: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
  a:hover { text-decoration-color: currentColor; }
  :focus-visible { outline: 2px solid var(--keen); outline-offset: 2px; border-radius: 3px; }
  .proto { background: #fef9c3; color: #713f12; font: 12px/1 var(--mono); padding: 7px 24px; border-bottom: 1px solid #fde68a; }
  header.top { display: flex; align-items: center; gap: 28px; padding: 12px 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 10; }
  .mark { display: inline-flex; align-items: center; gap: 8px; font: 600 15px var(--sans); text-decoration: none; }
  .mark svg { width: 22px; height: 22px; }
  header.top nav { display: flex; gap: 20px; font-size: 14px; }
  header.top nav a { text-decoration: none; color: var(--muted); }
  header.top nav a[aria-current] { color: var(--ink); font-weight: 500; }
  main { max-width: 1120px; margin: 0 auto; padding: 32px 24px 96px; }
  h1 { font: 600 32px/1.2 var(--serif); letter-spacing: -.01em; margin: 0 0 12px; max-width: 34ch; }
  h2 { font: 600 19px/1.3 var(--sans); margin: 40px 0 6px; }
  h3 { font: 600 12px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; }
  p { margin: 0 0 12px; }
  .lede { font-size: 16px; color: var(--ink-2); max-width: 72ch; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; max-width: 78ch; }
  .hint { color: var(--muted); font-size: 13px; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .btn { display: inline-flex; align-items: center; gap: 6px; background: var(--ink); color: #fff; border: 1px solid var(--ink); padding: 0 14px; height: 36px; font: 500 14px var(--sans); border-radius: var(--r); cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn:visited { color: #fff; }
  .btn.ghost { background: var(--panel); color: var(--ink); border-color: var(--line-2); }
  .btn.ghost:hover { border-color: var(--ink); }
  .btn svg { width: 15px; height: 15px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 20px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font: 500 12px var(--sans); color: var(--muted); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  th.r, td.r { text-align: right; } th.c, td.c { text-align: center; }
  .tablewrap { overflow-x: auto; }
  .pill { display: inline-flex; align-items: center; font: 500 11px var(--sans); padding: 2px 8px; border-radius: 99px; background: var(--soft); color: var(--ink-2); white-space: nowrap; }
  .fav { width: 16px; height: 16px; border-radius: 3px; vertical-align: -3px; margin-right: 6px; flex: none; }
  .mono-badge { display: inline-flex; width: 16px; height: 16px; margin-right: 6px; align-items: center; justify-content: center; font: 600 10px var(--sans); background: var(--ink); color: #fff; border-radius: 3px; vertical-align: -3px; flex: none; }
  .pv { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-weight: 500; }
  .pv .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .pv .fav, .pv .mono-badge { margin-right: 0; }
  .g { display: inline-flex; width: 15px; height: 15px; border-radius: 50%; align-items: center; justify-content: center; font: 700 9px var(--sans); }
  .g.c { background: var(--ok); color: #fff; }
  .g.p { background: #fef3c7; color: var(--part); border: 1.2px solid var(--part); }
  .g.w { background: #fff; color: var(--fail); border: 1.2px solid var(--fail); }
  .best { background: var(--best-bg); color: var(--best-fg); font-weight: 600; border-radius: 4px; padding: 1px 5px; }
  .worst { background: var(--worst-bg); color: var(--worst-fg); border-radius: 4px; padding: 1px 5px; text-decoration: line-through; text-decoration-color: rgba(107,114,128,.5); }
  .chk { display: inline-flex; gap: 3px; }
  .chk i { width: 15px; height: 15px; border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; font: 700 9px var(--sans); font-style: normal; }
  .chk i.y { background: var(--best-bg); color: var(--ok); } .chk i.n { background: var(--soft); color: var(--fail); border: 1px solid var(--line-2); }
  .hero { padding: 28px 0 6px; } .hero h1 { font-size: 42px; max-width: 22ch; }
  .list { margin-top: 10px; }
  .list a.it { display: grid; grid-template-columns: 1fr auto auto; gap: 24px; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); text-decoration: none; }
  .list a.it:last-child { border-bottom: 0; }
  .list a.it:hover { background: var(--soft); }
  .list .co { display: flex; align-items: center; font: 600 16px var(--sans); }
  .list .cat { color: var(--muted); font-size: 14px; margin-left: 22px; }
  .list .m { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
  .empty { padding: 28px; color: var(--muted); text-align: center; }
  .rhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .rhead .co { font: 600 16px var(--sans); display: inline-flex; align-items: center; }
  .rhead .meta { color: var(--muted); font-size: 13px; }
  .rhead .actions { margin-left: auto; display: flex; gap: 8px; }
  .summary { display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px; margin-top: 20px; }
  .summary .panel { padding: 16px 18px; }
  .ptitle { font: 600 14px var(--sans); margin: 0 0 2px; }
  .weights { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 12px 0 8px; }
  .weights label { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  .weights input { width: 100%; accent-color: var(--ink); }
  .weights .wv { font: 600 12px var(--mono); color: var(--ink); }
  .scorebar { height: 8px; border-radius: 99px; background: var(--soft); position: relative; min-width: 70px; }
  .scorebar i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line-2); margin: 32px 0 0; position: sticky; top: 59px; background: var(--bg); z-index: 5; }
  .tabs a { padding: 11px 14px; text-decoration: none; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 6px; align-items: center; }
  .tabs a.on { color: var(--ink); border-bottom-color: var(--ink); }
  .tabs .count { font: 12px var(--mono); color: var(--muted); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 16px 0 12px; }
  .chip { border: 1px solid var(--line-2); background: var(--panel); border-radius: 99px; padding: 4px 11px; font-size: 13px; cursor: pointer; text-decoration: none; color: var(--ink-2); }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
  .legend span { display: inline-flex; gap: 6px; align-items: center; }
  .plist .head, .plist summary { display: grid; grid-template-columns: 34px 1fr 108px repeat(5, 46px) 64px 16px; gap: 8px; align-items: center; padding: 10px 14px; }
  .plist .head { font: 500 12px var(--sans); color: var(--muted); border-bottom: 1px solid var(--line); }
  .plist .head .c { text-align: center; font-weight: 600; }
  .plist details { border-bottom: 1px solid var(--line); }
  .plist details:last-child { border-bottom: 0; }
  .plist summary { list-style: none; cursor: pointer; }
  .plist summary::-webkit-details-marker { display: none; }
  .plist summary:hover { background: var(--soft); }
  .plist details[open] > summary { background: var(--soft); }
  .plist .pt { font-weight: 500; }
  .plist .cc { text-align: center; }
  .plist .car { color: var(--muted); transition: transform .15s; }
  .plist details[open] .car { transform: rotate(90deg); }
  .pbody { padding: 6px 14px 18px 56px; }
  .ptable td { padding: 8px 10px; }
  .ptable tr.sel { cursor: pointer; }
  .ptable tr.sel:hover td, .ptable tr.sel:focus-visible td { background: var(--soft); }
  .ptable tr.sel:focus-visible { outline: 2px solid var(--keen); outline-offset: -2px; }
  .ptable tr.ans td { background: #fcfcfb; padding: 14px 16px 16px; }
  .anstext { max-width: 80ch; color: var(--ink-2); margin: 0 0 10px; }
  pre { font: 12px/1.55 var(--mono); background: #0f172a; color: #e2e8f0; padding: 12px 14px; white-space: pre-wrap; border-radius: 6px; margin: 8px 0; overflow-x: auto; }
  pre .k { color: #93c5fd; } pre .s { color: #86efac; } pre .c { color: #94a3b8; }
  .fm { font-size: 13px; color: var(--ink-2); }
  .srcs { display: inline-flex; align-items: center; gap: 4px; }
  .srcs .fav, .srcs .mono-badge { margin-right: 0; }
  .chart text { font: 11px var(--sans); fill: var(--muted); }
  .chart .lbl { font: 600 12px var(--sans); }
  .route { display: grid; grid-template-columns: 170px 24px 1fr; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .route:last-child { border-bottom: 0; }
  .note { border-left: 3px solid var(--part); background: #fffbeb; padding: 10px 14px; border-radius: 0 6px 6px 0; font-size: 14px; margin: 12px 0; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: var(--r); font-size: 14px; z-index: 20; }
  .method p { max-width: 74ch; color: var(--ink-2); }
  .hfav { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; font: 600 10px var(--sans); line-height: 1; }
  .hfav .fav, .hfav .mono-badge { margin: 0; }
  .hfav .bar2 { width: 18px; height: 3px; border-radius: 2px; }
  .h2h { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }
  .h2h > div { padding: 14px 16px; border-left: 1px solid var(--line); } .h2h > div:first-child { border-left: 0; }
  .h2h .v { font: 600 26px var(--serif); } .h2h .k { font-size: 12px; color: var(--muted); }
  select.inl { width: auto; display: inline-block; padding: 5px 8px; }
  @media (max-width: 860px) {
    .h2h { grid-template-columns: 1fr 1fr; }
    header.top { padding: 10px 16px; gap: 14px; } main { padding: 24px 16px 72px; }
    h1, .hero h1 { font-size: 26px; }
    .summary, .two { grid-template-columns: 1fr; }
    .plist .head { display: none; }
    .plist summary { grid-template-columns: 1fr; gap: 6px; } .plist summary .idx, .plist summary .car { display: none; }
    .plist summary .grades { display: flex !important; gap: 6px; }
    .pbody { padding: 4px 8px 16px; }
    .list a.it { grid-template-columns: 1fr; gap: 2px; } .list .cat { margin-left: 22px; }
    .rhead .actions { margin-left: 0; }
    .tabs { overflow-x: auto; top: 55px; }
  }
</style>
</head>
<body>
<div class="proto">PROTOTYPE · illustrative, seeded data · not real results</div>
<header class="top">
  <a class="mark" href="#/"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#111827"/><circle cx="14" cy="14" r="6.5" fill="none" stroke="#fff" stroke-width="3"/><path d="M19 19l6.5 6.5" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round"/></svg>Search Audit</a>
  <nav aria-label="Main"><a href="#/" data-nav="home">Reports</a><a href="#/methodology" data-nav="methodology">Methodology</a></nav>
</header>
<main id="app" tabindex="-1"></main>

<script>
"use strict";
// ============ Providers ============
const PROVIDERS = [
  { id: "exa", label: "Exa", short: "Exa", domain: "exa.ai", color: "var(--exa)", hex: "#c2410c" },
  { id: "parallel", label: "Parallel", short: "Parallel", domain: "parallel.ai", color: "var(--parallel)", hex: "#475569" },
  { id: "keen", label: "Keenable search", short: "Search", domain: "keenable.ai", color: "var(--keen)", hex: "#2563eb" },
  { id: "select", label: "Keenable SELECT", short: "SELECT", domain: "keenable.ai", color: "var(--select)", hex: "#dc2626" },
  { id: "routed", label: "Keenable routed", short: "Routed", domain: "keenable.ai", color: "var(--routed)", hex: "#7c3aed" },
];
const P = Object.fromEntries(PROVIDERS.map((p) => [p.id, p]));
const IDS = PROVIDERS.map((p) => p.id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function fav(domain, label) {
  const ch = esc((label || "?")[0].toUpperCase());
  if (!domain) return `<span class="mono-badge" aria-hidden="true">${ch}</span>`;
  return `<img class="fav" alt="" loading="lazy" data-mono="${ch}" src="https://icons.duckduckgo.com/ip3/${domain}.ico" onerror="favFallback(this)">`;
}
function favFallback(img) { const s = document.createElement("span"); s.className = "mono-badge"; s.textContent = img.dataset.mono; img.replaceWith(s); }
const pv = (id, short) => `<span class="pv"><span class="sw" style="background:${P[id].color}"></span>${fav(P[id].domain, P[id].label)}${short ? P[id].short : P[id].label}</span>`;
const hfav = (id) => `<span class="hfav" title="${P[id].label}">${fav(P[id].domain, P[id].label)}<span class="bar2" style="background:${P[id].color}"></span><span style="color:${P[id].color}">${P[id].short}</span></span>`;
const G_ICON = { c: "✓", p: "◐", w: "✗" }, G_NAME = { c: "correct", p: "partly correct", w: "wrong" };
const gIcon = (g, who) => `<span class="g ${g}" title="${who ? who + ": " : ""}${G_NAME[g]}" aria-label="${G_NAME[g]}">${G_ICON[g]}</span>`;

// ============ Seeded illustrative data ============
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rnd = mulberry32(20261007);
function gauss() { let u = 0; while (!u) u = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rnd()); }
function normCdf(x) { const t = 1 / (1 + 0.3275911 * Math.abs(x) / Math.SQRT2), y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x / 2); return x >= 0 ? (1 + y) / 2 : (1 - y) / 2; }
const pick = (a) => a[Math.floor(rnd() * a.length)];
const TYPES = [
  { id: "lookup", name: "Lookup", n: 22, p: { exa: .86, parallel: .82, keen: .88, select: .55 } },
  { id: "fresh", name: "Freshness", n: 14, p: { exa: .86, parallel: .78, keen: .72, select: .45 } },
  { id: "multihop", name: "Multi-hop", n: 18, p: { exa: .70, parallel: .72, keen: .70, select: .66 } },
  { id: "wide", name: "List-building", n: 16, p: { exa: .58, parallel: .66, keen: .58, select: .90 } },
  { id: "domain", name: "Regulation", n: 10, p: { exa: .88, parallel: .90, keen: .80, select: .74 } },
];
const T = Object.fromEntries(TYPES.map((t) => [t.id, t]));
const BASE = { exa: { c: .094, t: 7.9, s: 6.4 }, parallel: { c: .071, t: 8.6, s: 5.1 }, keen: { c: .019, t: 5.8, s: 6.0 }, select: { c: .022, t: 13.5, s: 1.6 } };
const TEMPLATES = {
  lookup: ["Is {v} SOC 2 Type II certified?", "Does {v} offer SAML SSO on its mid-tier plan?", "Where is {v} headquartered, and who is its CEO?", "Does {v} expose a public REST API for {t}?", "Which data-residency regions does {v} support?", "What is {v}'s list price for its enterprise plan?"],
  fresh: ["What changed in {v}'s most recent pricing announcement?", "Has {v} announced a funding round this quarter?", "What did {v} ship at its latest product event?", "Who is {v}'s current CTO?"],
  multihop: ["Which of {v}'s top three competitors integrate with Salesforce, and on which plans?", "Which customers did {v} announce in 2026, and in which industries?", "Compare {v} and its closest rival on uptime SLA and support hours.", "Which of {v}'s partners are also ISO 27001 certified?"],
  wide: ["List enterprise {t} vendors with SOC 2 Type II and SAML SSO, with pricing links.", "Table of Series B+ {t} startups in Europe founded after 2021, with their latest round.", "List every {t} tool that offers on-prem deployment, with source links.", "Which {t} vendors publish a public status page? Give the URLs."],
  domain: ["What does the EU AI Act require for high-risk {t} systems, and from when?", "What are the HIPAA requirements for storing {t} data with a third-party vendor?", "What does DORA require from ICT providers serving EU banks?"],
};
const VENDORS = ["Workday", "Snowflake", "Databricks", "HubSpot", "Zendesk", "Notion", "Rippling", "Ramp", "Gong", "Datadog", "Okta", "Airtable"];
const TOPICS = ["HR software", "contract-management", "procurement", "observability", "customer-support", "data-warehouse", "identity", "expense-management"];
const SRC = { lookup: ["{v}.com", "g2.com", "wikipedia.org", "crunchbase.com", "trust.{v}.com"], fresh: ["reuters.com", "techcrunch.com", "{v}.com", "theverge.com", "bloomberg.com"],
  multihop: ["g2.com", "{v}.com", "salesforce.com", "gartner.com", "techcrunch.com"], wide: ["crunchbase.com", "g2.com", "capterra.com", "{v}.com", "wikipedia.org"], domain: ["europa.eu", "hhs.gov", "eba.europa.eu", "iapp.org", "lexology.com"] };
const RUBRIC = ["Answers the prompt", "Facts correct", "Sources support it", "Up to date"];
const FAILURES = {
  wrong_source: { name: "Used the wrong source", def: "Answered from an unrelated or wrong vendor page." },
  outdated: { name: "Outdated information", def: "Found only older pages; the answer was right once but isn't now." },
  incomplete: { name: "Incomplete list", def: "Returned only some of the items a list prompt asked for." },
  unsupported: { name: "Claim not in sources", def: "Stated something the cited pages don't say." },
  wrong_tool: { name: "Wrong tool for the job", def: "Built a table for a single-fact prompt." },
  over_search: { name: "Over-searching", def: "Used more than 10 searches before answering." },
  error: { name: "Tool error / timeout", def: "The provider errored or the agent hit its time limit." },
};
const PROMPTS = [];
let pid = 1;
for (const t of TYPES) for (let i = 0; i < t.n; i++) {
  const v = pick(VENDORS);
  const text = t.id === "fresh" && i === 0 ? "Who is Tesla's current CTO?" : pick(TEMPLATES[t.id]).replace("{v}", v).replace("{t}", pick(TOPICS));
  const z = gauss();
  const r = {};
  for (const id of ["exa", "parallel", "keen", "select"]) {
    const u = normCdf(0.6 * z + 0.8 * gauss());
    const err = rnd() < 0.025;
    const g = err ? "w" : u < t.p[id] ? "c" : rnd() < 0.45 ? "p" : "w";
    const tail = id === "select" && rnd() < 0.12 ? 3 + rnd() * 8 : 1;
    const searches = id === "select" ? 1 + Math.floor(rnd() * 2) : Math.max(1, Math.round(BASE[id].s + gauss() * 2.2));
    r[id] = { g, err, cost: BASE[id].c * (0.7 + 0.6 * rnd()), time: BASE[id].t * (0.7 + 0.6 * rnd()) * tail, searches };
  }
  const toSelect = t.id === "wide" || (t.id === "multihop" && rnd() < 0.25);
  const pJ = 0.7 + rnd() * 0.27;
  const via = toSelect ? "select" : "keen";
  r.routed = { ...r[via], cost: r[via].cost + 0.0004, time: r[via].time + 0.3, via, pJ };

      <td class="c">${gIcon(x.g)}</td><td><span class="chk">${x.chk.map((v, k) => `<i class="${v ? "y" : "n"}" title="${RUBRIC[k]}: ${v ? "pass" : "fail"}">${v ? "✓" : "✗"}</i>`).join("")}</span></td>
      <td class="fm">${x.fail ? FAILURES[x.fail].name : '<span class="hint">—</span>'}</td>
      <td class="r num"><span class="${hV[id] || ""}">${Math.round(promptScore(p, id, state.w) * 100)}</span></td><td class="r num"><span class="${hT[id] || ""}">${secs(x.time)}</span></td><td class="r num"><span class="${hC[id] || ""}">${money(x.cost)}</span></td><td class="r num"><span class="${hN[id] || ""}">${x.searches}</span></td>
      <td><span class="srcs">${x.src.map((d) => `<span title="${d}${count[d] > 1 ? " · also cited by others" : " · only this provider"}" style="${count[d] > 1 ? "" : "box-shadow:0 0 0 1.5px " + P[id].hex + ";border-radius:3px"}">${fav(d, d)}</span>`).join("")}</span></td></tr>
      ${open ? `<tr class="ans"><td colspan="9">${answerPanel(p, id)}</td></tr>` : ""}`; }).join("")}
    </tbody></table></div>
    <p class="hint" style="margin:8px 0 0">Judge checks: ${RUBRIC.join(" · ")}. Score uses your weights. Sources ringed in a provider's colour were cited only by that provider. <button class="btn ghost" style="height:28px;font-size:12px;margin-left:8px" onclick="copyLink(${p.id})">Copy link</button></p>`;
}
function answerText(p, id) {
  if (p.id === TESLA) return { exa: "Tesla has had no titled CTO since 2019; engineering is led by its SVP of Vehicle Engineering.", parallel: "As of October 2026 Tesla lists no CTO; the most senior engineering leader is its SVP of Engineering.", keen: "Tesla has had no titled CTO since JB Straubel left in 2019.", select: "Returned a table of past CTOs; the 2019 row was presented as the current CTO.", routed: "Tesla has had no titled CTO since 2019." }[id];
  return { c: "Placeholder: the agent's full answer appears here, with inline citations.", p: "Placeholder: partly right; the failed judge check is shown in the row above.", w: "Placeholder: the incorrect answer appears here, with the sources it relied on." }[p.r[id].g];
}
function answerPanel(p, id) {
  const x = p.r[id];
  const cmd = `searchaudit rerun --report 7f3c9a2e --prompt ${p.id} --provider ${{ keen: "keenable-search", select: "keenable-select", routed: "keenable-routed" }[id] || id}`;
  const usesSelect = id === "select" || x.via === "select";
  return `<div class="two" style="grid-template-columns:1.2fr 1fr"><div><h3 style="margin-top:0">Answer</h3><p class="anstext">${esc(answerText(p, id))}</p>
      <h3>Judge</h3><p class="anstext">${x.chk.every(Boolean) ? "Passes all four checks." : `Fails: ${RUBRIC.filter((_, k) => !x.chk[k]).join(", ")}.`} ${x.fail ? FAILURES[x.fail].def : ""}</p>
      <h3>Sources</h3><p class="anstext">${x.src.map((d) => `${fav(d, d)}<a href="#">${d}</a>`).join(" &nbsp; ")}</p></div>
    <div><h3 style="margin-top:0">Tool trace</h3><pre>${id === "routed" ? `<span class="c"># Jev: ${x.via === "select" ? "list/table" : "single answer"} → ${P[x.via].label} (p=${x.pJ.toFixed(2)})</span>\n` : ""}${usesSelect ? `<span class="k">SELECT</span> SEM_EXTRACT(content, <span class="s">'name'</span>), ANY_VALUE(url)\n<span class="k">FROM</span> WEB_SEARCH(<span class="s">6 queries</span>)\n<span class="k">WHERE</span> SEM_MATCH(content, <span class="s">'${esc(p.text.slice(0, 40))}…'</span>)` : `1 search(<span class="s">"${esc(p.text.slice(0, 34))}…"</span>)  1.2s  8 results\n2 fetch(${x.src[0]})  0.8s${x.searches > 2 ? `\n<span class="c">… ${x.searches - 2} more searches</span>` : ""}`}</pre>
      <h3>Reproduce</h3><pre>${cmd}</pre></div></div>`;
}
function toggleAns(pidv, id) { state.ans[pidv + id] = !state.ans[pidv + id]; state.open = pidv; render.keep = true; const y = scrollY; render(); scrollTo(0, y); const row = document.querySelector(`#p${pidv} tr[aria-label^="${P[id].label}:"]`); if (row) row.focus(); }

function tabH2H(m) {
  const a = state.a, b = state.b === state.a ? IDS.find((x) => x !== a) : state.b;
  const both = PROMPTS.filter((p) => ok(p, a) && ok(p, b)), onlyA = PROMPTS.filter((p) => ok(p, a) && !ok(p, b)), onlyB = PROMPTS.filter((p) => !ok(p, a) && ok(p, b)), none = PROMPTS.filter((p) => !ok(p, a) && !ok(p, b));
  const pval = mcnemar(onlyA.length, onlyB.length);
  const sel = (k, v) => `<select class="inl" aria-label="Provider ${k.toUpperCase()}" onchange="state.${k}=this.value;render.keep=true;render()">${IDS.map((id) => `<option value="${id}" ${id === v ? "selected" : ""}>${P[id].label}</option>`).join("")}</select>`;
  const cheaper = PROMPTS.filter((p) => p.r[a].cost < p.r[b].cost).length, faster = PROMPTS.filter((p) => p.r[a].time < p.r[b].time).length;
  const row = (p) => `<tr style="cursor:pointer" onclick="state.tab='prompts';state.filter='all';state.type='all';state.open=${p.id};state.ans={['${p.id}${a}']:true,['${p.id}${b}']:true};render()"><td>${esc(p.text)}</td><td><span class="pill">${T[p.type].name}</span></td><td class="c">${gIcon(p.r[a].g)}</td><td class="c">${gIcon(p.r[b].g)}</td><td class="fm">${p.r[a].fail ? FAILURES[p.r[a].fail].name : (p.r[b].fail ? FAILURES[p.r[b].fail].name : "")}</td><td class="r num">${secs(p.r[a].time)} · ${secs(p.r[b].time)}</td></tr>`;
  return `<p class="sub" style="margin-top:18px">Compare any two providers on the same ${m.n} prompts.</p>
    <div class="row" style="margin:0 0 14px">${sel("a", a)}<span class="hint">vs</span>${sel("b", b)}</div>
    <div class="panel h2h"><div><div class="k">Both correct</div><div class="v">${both.length}</div></div><div><div class="k">Only ${P[a].label}</div><div class="v" style="color:${P[a].color}">${onlyA.length}</div></div><div><div class="k">Only ${P[b].label}</div><div class="v" style="color:${P[b].color}">${onlyB.length}</div></div><div><div class="k">Neither</div><div class="v">${none.length}</div></div></div>
    <p class="sub" style="margin-top:10px">${pval < 0.05 ? `<b>${onlyA.length > onlyB.length ? P[a].label : P[b].label} is more accurate</b> (paired test, p = ${pval.toFixed(3)}).` : `No clear accuracy difference (paired test, p = ${pval.toFixed(2)}).`} ${P[a].label} was cheaper on ${cheaper} of ${m.n} prompts and faster on ${faster}. Median: ${money(m.st[a].perQ)} vs ${money(m.st[b].perQ)} per prompt, ${secs(m.st[a].t50)} vs ${secs(m.st[b].t50)}.</p>
    ${[["Only " + P[a].label + " correct", onlyA], ["Only " + P[b].label + " correct", onlyB]].map(([t, list]) => `<h2>${t} <span class="hint num">${list.length}</span></h2>${list.length ? `<div class="panel tablewrap"><table><thead><tr><th>Prompt</th><th>Type</th><th class="c">${hfav(a)}</th><th class="c">${hfav(b)}</th><th>Failure</th><th class="r">Time</th></tr></thead><tbody>${list.map(row).join("")}</tbody></table></div>` : `<p class="hint">None.</p>`}`).join("")}`;
}
function tabFailures(m) {
  const counts = Object.fromEntries(Object.keys(FAILURES).map((f) => [f, Object.fromEntries(IDS.map((id) => [id, PROMPTS.filter((p) => p.r[id].fail === f).length]))]));
  return `<p class="sub" style="margin-top:18px">How each provider's answers went wrong across all ${m.n} prompts (the judge's main reason per answer). Click a number to open an example.</p>
    <div class="panel tablewrap"><table><thead><tr><th>Failure mode</th>${PROVIDERS.map((p) => `<th class="r">${pv(p.id, true)}</th>`).join("")}</tr></thead><tbody>
    ${Object.entries(FAILURES).map(([f, d]) => { const h = hl(counts[f], true); return `<tr><td><span style="font-weight:500">${d.name}</span><div class="hint">${d.def}</div></td>${IDS.map((id) => { const ex = PROMPTS.find((p) => p.r[id].fail === f); return `<td class="r num">${counts[f][id] ? `<a href="#/r/7f3c9a2e" onclick="state.tab='prompts';state.filter='all';state.type='all';state.open=${ex.id};state.ans={['${ex.id}${id}']:true}"><span class="${h[id] || ""}">${counts[f][id]}</span></a>` : `<span class="${h[id] || ""}">0</span>`}</td>`; }).join("")}</tr>`; }).join("")}
    <tr><td><b>All failures</b></td>${IDS.map((id) => `<td class="r num"><b>${PROMPTS.filter((p) => p.r[id].fail).length}</b></td>`).join("")}</tr></tbody></table></div>
    <h2>Failures by prompt type</h2><p class="sub">Prompts each provider did not get fully right, per type. Lower is better.</p>
    <div class="panel tablewrap"><table><thead><tr><th>Type</th><th class="r">Prompts</th>${PROVIDERS.map((p) => `<th class="r">${pv(p.id, true)}</th>`).join("")}</tr></thead><tbody>
    ${m.types.map((x) => { const v = Object.fromEntries(IDS.map((id) => [id, x.n - x.st[id].k])); const h = hl(v, true); return `<tr><td>${x.t.name}</td><td class="r num">${x.n}</td>${IDS.map((id) => `<td class="r num"><span class="${h[id] || ""}">${v[id]}</span></td>`).join("")}</tr>`; }).join("")}</tbody></table></div>`;
}
function tabImpl(m) {
  const st = m.st;
  const routes = m.types.map((x) => ({ x, to: x.kBest, alt: !["keen", "select", "routed"].includes(x.best) && x.st[x.best].score - x.st[x.kBest].score > 5 ? x.best : null }));
  const toSel = routes.filter((r) => r.to === "select").map((r) => r.x.t.name.toLowerCase());
  const mixCost = m.types.reduce((s, x) => s + x.n * x.st[x.kBest].cost, 0) / m.n;
  const vols = [1e5, 1e6, 1e7];
  const rows = [...IDS.map((id) => ({ id, label: pv(id), c: st[id].perQ })), { id: "plan", label: `<span class="pv"><span class="sw" style="background:var(--routed)"></span>Recommended router</span>`, c: mixCost }];
  const h = hl(Object.fromEntries(rows.map((r) => [r.id, +r.c.toFixed(4)])), true);
  return `<p class="sub" style="margin-top:18px">Generated from this audit's results; it changes when the results change.</p>
    <div class="two"><div class="panel" style="padding:16px 18px"><p class="ptitle">Recommended setup for StackAI</p>
      <p class="hint" style="margin:0 0 6px">One search tool for StackAI's agents. Jev classifies each call. A type goes to SELECT only when SELECT was clearly better than search on it (paired test); otherwise it defaults to search, which is cheaper and faster.</p>
      ${routes.map((r) => `<div class="route"><span>${r.x.t.name} <span class="hint num">· ${r.x.n}</span></span><span class="hint">→</span><span>${pv(r.to)} ${r.x.clear ? '<span class="pill" style="background:var(--best-bg);color:var(--best-fg)">clear</span>' : `<span class="pill" title="Search vs SELECT difference on this type could be chance (p = ${r.x.pKS.toFixed(2)}). Defaulting to search.">lean · re-test</span>`}</span></div>`).join("")}
      ${routes.filter((r) => r.alt).map((r) => `<div class="note"><b>${r.x.t.name}:</b> ${P[r.alt].label} scored ${(r.x.st[r.alt].score - r.x.st[r.to].score).toFixed(0)} points higher than Keenable on this type. If these prompts matter most, route them to ${P[r.alt].label}.</div>`).join("")}
    </div>
    <div class="panel" style="padding:16px 18px"><p class="ptitle">Router config</p>
<pre><span class="k">from</span> searchaudit.router <span class="k">import</span> JevRouter

router = JevRouter(
    classify=<span class="s">"typesafe/jev-1.13"</span>,   <span class="c"># via OpenRouter</span>
    routes={
${routes.map((r) => `        <span class="s">"${r.x.t.id}"</span>: <span class="s">"${r.alt || (r.to === "select" ? "keenable-select" : "keenable-search")}"</span>,`).join("\n")}
    },
    default=<span class="s">"keenable-search"</span>,
    fallback=<span class="s">"exa"</span>,             <span class="c"># on provider error</span>
)
results = router.search(prompt)</pre>
      <p class="hint">${toSel.length ? `Routes ${toSel.join(", ")} prompts to SELECT.` : "No type routes to SELECT on this data."} Drop-in search tool for any agent framework.</p></div></div>
    <h2>Monthly cost at your volume</h2><p class="sub">Search + agent model per prompt, from this audit. Estimates; enter real volume when creating an audit.</p>
    <div class="panel tablewrap"><table><thead><tr><th>Setup</th>${vols.map((v) => `<th class="r">${v >= 1e6 ? v / 1e6 + "M" : v / 1e3 + "k"} prompts / mo</th>`).join("")}</tr></thead><tbody>
      ${rows.map((r) => `<tr><td>${r.label}${r.id === "exa" ? ' <span class="pill">today</span>' : ""}</td>${vols.map((v) => `<td class="r num"><span class="${h[r.id] || ""}">${big$(r.c * v)}</span></td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <h2>Rollout</h2>
    <div class="panel" style="padding:4px 18px">${[["Week 1", "Shadow 5% of search calls through the router; log both answers."], ["Week 2", "Grade a 5% sample with the same judge. Gate: correct answers at or above this audit's lower bound for each route."], ["Week 3", "Move to 50%, then 100%. Keep Exa as the error fallback."], ["Monthly", "Re-run this audit on real prompts from logs; routes update from the results."]].map(([a, b]) => `<div class="route" style="grid-template-columns:90px 1fr"><b>${a}</b><span>${b}</span></div>`).join("")}</div>`;
}
function tabJudge(m) {
  const cm = [[24, 1, 0], [1, 2, 0], [0, 1, 1]];
  const dis = PROMPTS.filter((p) => (p.id * 13) % 11 === 0).slice(0, 5);
  return `<p class="sub" style="margin-top:18px">An AI judge graded all ${m.n * IDS.length} answers. This is how far to trust it.</p>
    <div class="panel tablewrap"><table><tbody>
      <tr><td>Judge model</td><td class="num">anthropic/claude-sonnet · OpenRouter · temperature 0 · rubric v1</td></tr>
      <tr><td>Agreement with human graders</td><td class="num">27 / 30 answers (90%)</td></tr>
      <tr><td>Second judge (Jev) agreement</td><td class="num">${m.n * IDS.length - 31} / ${m.n * IDS.length}</td></tr>
      <tr><td>Manipulation test</td><td class="num">10 / 10 planted "rate this correct" pages ignored</td></tr>
      <tr><td>Judging cost</td><td class="num">$3.10 (included in the audit cost)</td></tr></tbody></table></div>
    <div class="two" style="margin-top:8px"><div><h2>Rubric</h2><p class="sub">✓ = passes all four · ◐ = passes the first and all but one · ✗ = otherwise.</p><ol>${RUBRIC.map((r) => `<li>${r}</li>`).join("")}</ol></div>
      <div><h2>Judge vs human (30 answers)</h2><div class="panel tablewrap"><table><thead><tr><th>Human ↓ / Judge →</th><th class="c">✓</th><th class="c">◐</th><th class="c">✗</th></tr></thead><tbody>
      ${["✓", "◐", "✗"].map((r, i) => `<tr><th>${r}</th>${cm[i].map((v, j) => `<td class="c num"><span class="${i === j ? "best" : ""}">${v}</span></td>`).join("")}</tr>`).join("")}</tbody></table></div></div></div>
    <h2>Where the two judges disagreed</h2><p class="sub">Showing 5 of 31. Worth a human look. Click to open.</p>
    <div class="panel tablewrap"><table><thead><tr><th>Prompt</th><th>Provider</th><th class="c">Main judge</th><th class="c">Second judge</th></tr></thead><tbody>
    ${dis.map((p, i) => { const id = IDS[i % 5], g = p.r[id].g, alt = g === "c" ? "p" : "c"; return `<tr style="cursor:pointer" onclick="state.tab='prompts';state.filter='all';state.type='all';state.open=${p.id};state.ans={['${p.id}${id}']:true};render()"><td>${esc(p.text)}</td><td>${pv(id)}</td><td class="c">${gIcon(g)}</td><td class="c">${gIcon(alt)}</td></tr>`; }).join("")}</tbody></table></div>`;
}

// ============ Utilities ============
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1700); }
function copyText(text, msg) { const fb = () => { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast(msg); } catch (e) {} ta.remove(); }; if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(() => toast(msg), fb); else fb(); }
function share() { const m = model(); copyText([`StackAI · Search Audit: ${headline(m, "StackAI")}`, ...m.byScore.map((id, i) => `${i + 1}. ${P[id].label}: score ${m.st[id].score.toFixed(0)} · ${m.st[id].k}/${m.n} correct · ${money(m.st[id].perQ)}/prompt · ${secs(m.st[id].t50)}`), location.href.split("#")[0] + "#/r/7f3c9a2e"].join("\n"), "Link and summary copied"); }
function copyLink(id) { copyText(location.href.split("#")[0] + "#/r/7f3c9a2e?p=" + id, "Link copied"); }

// ============ Router ============
function render() {
  const h = location.hash.replace(/^#/, "") || "/", parts = h.split("?")[0].split("/").filter(Boolean);
  const qp = new URLSearchParams(h.split("?")[1] || "");
  let html, nav = "";
  if (!parts.length) { nav = "home"; html = views.home(); }
  else if (parts[0] === "r" && parts[2] === "pdf") html = views.pdf();
  else if (parts[0] === "r") { if (qp.get("tab")) state.tab = qp.get("tab"); if (qp.get("p")) { state.tab = "prompts"; state.filter = "all"; state.type = "all"; state.open = Number(qp.get("p")); } if (qp.get("ans")) state.ans[qp.get("p") + qp.get("ans")] = true; html = views.report(); }
  else if (parts[0] === "methodology") { nav = "methodology"; html = views.methodology(); }
  else html = `<h1>Not found</h1><p><a href="#/">Back to reports</a></p>`;
  document.getElementById("app").innerHTML = html;
  document.querySelectorAll("[data-nav]").forEach((a) => a.toggleAttribute("aria-current", a.dataset.nav === nav));
  const target = state.open && document.getElementById("p" + state.open);
  if (target && !render.keep) target.scrollIntoView({ block: "start" });
  else if (!render.keep) window.scrollTo(0, 0);
  render.keep = false;
}
window.addEventListener("hashchange", render);
document.addEventListener("click", (e) => { const a = e.target.closest("a[onclick]"); if (a) { e.preventDefault(); render.keep = !/state\.open=\d/.test(a.getAttribute("onclick")); setTimeout(render, 0); } });
render();
</script>
</body>
