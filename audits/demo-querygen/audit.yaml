# Demo of `searchaudit querygen` on StackAI (small target). Generate the prompt set with:
#   uv run python -m searchaudit querygen audits/demo-querygen/audit.yaml --target 8
# then run it like any audit (run / judge / assemble). Copied from audits/stackai/audit.yaml.
slug: demo-querygen
company: StackAI
category: Enterprise AI agent platform
company_url: https://www.stack-ai.com
use_case_hints:
  - KYC / supplier due diligence on companies
  - Investment and market research memos
  - Regulatory and compliance monitoring
prompts_file: prompts.json

model: openrouter/auto
temperature: 0.2

judge_model: anthropic/claude-sonnet-5.5
router_model: typesafe/jev-router

budget:
  max_tool_calls: 15
  max_seconds: 180

cost_cap_usd: 40

concurrency:
  global: 12
  default_per_provider: 4

# Research and reference checks use Claude's own (native) web search, not an audited provider.
querygen:
  model: anthropic/claude-sonnet-5.5
  search_engine: native
  oversample: 3
  routine_share: 0.10
  fresh_days: 90
  max_usd: 3
  concurrency: 6

providers:
  - {id: exa, label: Exa, short: Exa, domain: exa.ai, hex: "#c2410c", uses_today: true}
  - {id: parallel, label: Parallel, short: Parallel, domain: parallel.ai, hex: "#475569"}
  - {id: keen, label: Keenable search, short: Search, domain: keenable.ai, hex: "#2563eb"}
  - {id: select, label: Keenable SELECT, short: SELECT, domain: keenable.ai, hex: "#dc2626"}
  - {id: routed, label: Keenable routed, short: Routed, domain: keenable.ai, hex: "#7c3aed"}
  - {id: none}   # no-search baseline; label/colour default to "No search (model memory)", #9ca3af
