# Search Audit: SpaceX. The customer-decision report (which provider this workload should use).
# Finished at 60 prompts. A 100-prompt rerun is a new generation: do not pass --force over this
# directory, or the scored runs stop matching the prompts.
# Run with `uv run python -m searchaudit run audits/spacex/audit.yaml`.
slug: spacex
company: SpaceX
category: "Consumer AI assistant (Grok on X)"
prompts_file: prompts.json

# Resolved once per audit by a calibration call and pinned for every provider (see pinned.json).
model: openrouter/auto
temperature: 0.2

judge_model: anthropic/claude-sonnet-5.5
# Jev on OpenRouter. "typesafe/jev-1.13" (the code default) is not in the public model list but
# "typesafe/jev-router" is (checked 2026-10-07). If the id disappears the run uses the agent model.
router_model: typesafe/jev-router

budget:
  max_tool_calls: 15
  max_seconds: 180

cost_cap_usd: 40

concurrency:
  global: 32
  default_per_provider: 10
  per_provider: {select: 2, routed: 2}  # SELECT returns MCP errors under load (2026-10-07)

providers:
  - {id: exa, label: Exa, short: Exa, domain: exa.ai, hex: "#c2410c"}
  - {id: parallel, label: Parallel, short: Parallel, domain: parallel.ai, hex: "#475569"}
  - {id: keen, label: Keenable search, short: Search, domain: keenable.ai, hex: "#2563eb"}
  - {id: select, label: Keenable SELECT, short: SELECT, domain: keenable.ai, hex: "#dc2626"}
  - {id: routed, label: Keenable routed, short: Routed, domain: keenable.ai, hex: "#7c3aed"}
  - {id: none}
