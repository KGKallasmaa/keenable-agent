# The SpaceX 60, re-run on one Grok model. Do not pass --force over audits/spacex/.
# The page at /r/spacex-pitch reads this directory only when every cell is judged.
slug: spacex-grok
company: SpaceX
category: "Grok re-run of the SpaceX 60"
prompts_file: "../spacex/prompts.json"
model: x-ai/grok-4.7
temperature: 0.2
judge_model: anthropic/claude-sonnet-5.5
router_model: typesafe/jev-router
# SELECT retries SQL and a single call can take about 90s. 180s was dying after two calls.
budget:
  max_tool_calls: 30
  max_seconds: 600
cost_cap_usd: 200
concurrency:
  global: 32
  default_per_provider: 10
  per_provider: {select: 2, routed: 2}
providers:
  - {id: exa, label: Exa, short: Exa, domain: exa.ai, hex: "#c2410c"}
  - {id: parallel, label: Parallel, short: Parallel, domain: parallel.ai, hex: "#475569"}
  - {id: keen, label: Keenable search, short: Search, domain: keenable.ai, hex: "#2563eb"}
  - {id: select, label: Keenable SELECT, short: SELECT, domain: keenable.ai, hex: "#dc2626"}
  - {id: grok, label: Grok native, short: Grok, domain: x.ai, hex: "#111827"}
  - {id: routed, label: Keenable router, short: Router, domain: keenable.ai, hex: "#7c3aed"}
